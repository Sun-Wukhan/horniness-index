name: Horniness Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish the Index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pipeline dependencies
        run: pip install -q -r pipeline/requirements.txt

      - name: Start Redpanda (Kafka) broker
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v24.3.6 \
            redpanda start --smp 1 --memory 1G --overprovisioned --node-id 0 \
            --kafka-addr internal://0.0.0.0:9092 \
            --advertise-kafka-addr internal://127.0.0.1:9092 \
            --pandaproxy-addr internal://0.0.0.0:8082 \
            --advertise-pandaproxy-addr internal://127.0.0.1:8082 \
            --schema-registry-addr internal://0.0.0.0:8081 \
            --rpc-addr 0.0.0.0:33145 --advertise-rpc-addr 127.0.0.1:33145

      - name: Build the Index (Kafka pipeline, standalone fallback)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 pipeline/run_pipeline.py --transport kafka --bootstrap localhost:9092 --out site \
            || python3 horniness-index.py site

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
